kind = "web"
previewPath = "/"
title = "GridCrafters"
version = "1.0.0"
id = "artifacts/gridcrafters"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22371

[services.development]
run = "pnpm --filter @workspace/gridcrafters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gridcrafters", "run", "build" ]
publicDir = "artifacts/gridcrafters/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22371"
BASE_PATH = "/"
